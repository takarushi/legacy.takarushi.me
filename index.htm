<script type="text/javascript">
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
              'August', 'September', 'October', 'November', 'December'];

// Equivalent of date('l, F j, Y')
function formatToday() {
  var d = new Date();
  return DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function trim(s) {
  return s.replace(/^\s+|\s+$/g, '');
}

// Safe text insertion (same job as htmlspecialchars); textContent doesn't exist in old IE
function setText(el, text) {
  while (el.firstChild) {
    el.removeChild(el.firstChild);
  }
  el.appendChild(document.createTextNode(text));
}

function createRequest() {
  if (window.XMLHttpRequest) {
    return new XMLHttpRequest();
  }
  if (window.ActiveXObject) {
    try { return new ActiveXObject('Microsoft.XMLHTTP'); } catch (e) {}
  }
  return null;
}

// Loads a text file; calls callback(text) on success or callback(null) on failure.
// A timestamp is added to the URL because old IE caches XHR requests aggressively.
function loadText(url, callback) {
  var xhr = createRequest();
  if (!xhr) {
    callback(null);
    return;
  }
  var sep = (url.indexOf('?') === -1) ? '?' : '&';
  xhr.open('GET', url + sep + 't=' + new Date().getTime(), true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) {
      return;
    }
    if ((xhr.status >= 200 && xhr.status < 300) || (xhr.status === 0 && xhr.responseText)) {
      callback(xhr.responseText);
    } else {
      callback(null);
    }
  };
  try {
    xhr.send(null);
  } catch (e) {
    callback(null);
  }
}

// Equivalent of chooseContent(): random non-empty, non-comment line, inserted as raw HTML
function chooseContent(url, callback) {
  loadText(url, function (text) {
    if (text === null) {
      callback('<p>Missing rotator file.</p>');
      return;
    }
    if (trim(text) === '') {
      callback('<p>No rotator content found.</p>');
      return;
    }

    var lines = text.replace(/\r\n?/g, '\n').split('\n');
    var valid = [];
    for (var i = 0; i < lines.length; i++) {
      var line = trim(lines[i]);
      if (line === '' || line.charAt(0) === '#') {
        continue;
      }
      valid.push(line);
    }

    if (valid.length === 0) {
      callback('<p>No valid rotator entries found.</p>');
      return;
    }

    callback(valid[Math.floor(Math.random() * valid.length)]);
  });
}

// First line of brknews.txt
function getBreakingNews(url, callback) {
  loadText(url, function (text) {
    if (text === null) {
      callback('');
      return;
    }
    callback(trim(text.replace(/\r\n?/g, '\n').split('\n')[0]));
  });
}

setText(document.getElementById('today'), formatToday());

chooseContent('text/rotate.txt', function (html) {
  document.getElementById('rotator').innerHTML = html;
});

getBreakingNews('text/brknews.txt', function (news) {
  setText(document.getElementById('breaking-news'), news);
});
</script>
